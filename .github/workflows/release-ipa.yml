name: Release unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project BeanLog.xcodeproj \
            -scheme BeanLog \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BeanLog.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Surface compiler errors as annotations
        if: failure()
        run: |
          grep -E "error:|\*\* ARCHIVE FAILED" "$RUNNER_TEMP/build.log" | sort -u | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Package BeanLog-unsigned.ipa
        run: |
          APP="$RUNNER_TEMP/BeanLog.xcarchive/Products/Applications/BeanLog.app"
          test -d "$APP"
          rm -rf Payload BeanLog-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry BeanLog-unsigned.ipa Payload
          ls -lh BeanLog-unsigned.ipa
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}-${{ env.SHORT_SHA }}
          name: BeanLog v1.0.${{ github.run_number }} (${{ env.SHORT_SHA }})
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: BeanLog-unsigned.ipa
